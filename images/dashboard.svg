<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <style>
    .screen { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 4; }
    .header { fill: #1a73e8; }
    .sidebar { fill: #0c3b7c; }
    .chart-bar { fill: #4285f4; }
    .chart-bar-alt { fill: #5c9fff; }
    .chart-line { fill: none; stroke: #0c3b7c; stroke-width: 3; }
    .chart-point { fill: #1a73e8; }
    .data-row { fill: #f1f3f4; }
    .shadow { fill: rgba(0, 0, 0, 0.1); }
  </style>
  
  <!-- Screen Shadow -->
  <rect class="shadow" x="110" y="95" width="590" height="420" rx="10" ry="10" />
  
  <!-- Screen -->
  <rect class="screen" x="100" y="85" width="590" height="420" rx="10" ry="10" />
  
  <!-- Header -->
  <rect class="header" x="100" y="85" width="590" height="60" rx="10" ry="10" />
  <rect x="130" y="105" width="120" height="20" rx="5" ry="5" fill="#ffffff" opacity="0.8" />
  <circle cx="650" cy="115" r="15" fill="#ffffff" opacity="0.8" />
  <circle cx="610" cy="115" r="15" fill="#ffffff" opacity="0.8" />
  
  <!-- Sidebar -->
  <rect class="sidebar" x="100" y="145" width="120" height="360" />
  <rect x="115" y="175" width="90" height="12" rx="6" ry="6" fill="#ffffff" opacity="0.8" />
  <rect x="115" y="205" width="90" height="12" rx="6" ry="6" fill="#ffffff" opacity="0.6" />
  <rect x="115" y="235" width="90" height="12" rx="6" ry="6" fill="#ffffff" opacity="0.6" />
  <rect x="115" y="265" width="90" height="12" rx="6" ry="6" fill="#ffffff" opacity="0.6" />
  <rect x="115" y="295" width="90" height="12" rx="6" ry="6" fill="#ffffff" opacity="0.6" />
  <rect x="115" y="325" width="90" height="12" rx="6" ry="6" fill="#ffffff" opacity="0.6" />
  
  <!-- Main Content -->
  <rect x="240" y="165" width="430" height="160" rx="5" ry="5" fill="#ffffff" />
  
  <!-- Chart -->
  <rect x="260" y="185" width="390" height="120" rx="5" ry="5" fill="#f9f9f9" />
  <line x1="260" y1="285" x2="650" y2="285" stroke="#dddddd" stroke-width="1" />
  <line x1="260" y1="255" x2="650" y2="255" stroke="#dddddd" stroke-width="1" />
  <line x1="260" y1="225" x2="650" y2="225" stroke="#dddddd" stroke-width="1" />
  <line x1="260" y1="195" x2="650" y2="195" stroke="#dddddd" stroke-width="1" />
  
  <!-- Bar Chart -->
  <rect class="chart-bar" x="280" y="245" width="20" height="40" />
  <rect class="chart-bar-alt" x="310" y="225" width="20" height="60" />
  <rect class="chart-bar" x="340" y="255" width="20" height="30" />
  <rect class="chart-bar-alt" x="370" y="215" width="20" height="70" />
  <rect class="chart-bar" x="400" y="235" width="20" height="50" />
  <rect class="chart-bar-alt" x="430" y="205" width="20" height="80" />
  
  <!-- Line Chart -->
  <path class="chart-line" d="M480,265 L510,235 L540,245 L570,205 L600,215 L630,195" />
  <circle class="chart-point" cx="480" cy="265" r="5" />
  <circle class="chart-point" cx="510" cy="235" r="5" />
  <circle class="chart-point" cx="540" cy="245" r="5" />
  <circle class="chart-point" cx="570" cy="205" r="5" />
  <circle class="chart-point" cx="600" cy="215" r="5" />
  <circle class="chart-point" cx="630" cy="195" r="5" />
  
  <!-- Data Table -->
  <rect x="240" y="345" width="430" height="140" rx="5" ry="5" fill="#ffffff" />
  <rect x="260" y="365" width="390" height="25" fill="#f1f3f4" />
  <rect class="data-row" x="260" y="390" width="390" height="25" />
  <rect x="260" y="415" width="390" height="25" fill="#ffffff" />
  <rect class="data-row" x="260" y="440" width="390" height="25" />
  
  <!-- Stats Cards -->
  <rect x="240" y="165" width="430" height="160" rx="5" ry="5" fill="#ffffff" />
  <rect x="240" y="345" width="130" height="140" rx="5" ry="5" fill="#4285f4" />
  <rect x="390" y="345" width="130" height="140" rx="5" ry="5" fill="#1a73e8" />
  <rect x="540" y="345" width="130" height="140" rx="5" ry="5" fill="#0c3b7c" />
  
  <!-- Stats Icons -->
  <circle cx="305" cy="395" r="25" fill="rgba(255,255,255,0.2)" />
  <circle cx="455" cy="395" r="25" fill="rgba(255,255,255,0.2)" />
  <circle cx="605" cy="395" r="25" fill="rgba(255,255,255,0.2)" />
  
  <!-- Stats Text -->
  <rect x="270" y="440" width="70" height="10" rx="5" ry="5" fill="rgba(255,255,255,0.7)" />
  <rect x="270" y="460" width="40" height="10" rx="5" ry="5" fill="rgba(255,255,255,0.5)" />
  
  <rect x="420" y="440" width="70" height="10" rx="5" ry="5" fill="rgba(255,255,255,0.7)" />
  <rect x="420" y="460" width="40" height="10" rx="5" ry="5" fill="rgba(255,255,255,0.5)" />
  
  <rect x="570" y="440" width="70" height="10" rx="5" ry="5" fill="rgba(255,255,255,0.7)" />
  <rect x="570" y="460" width="40" height="10" rx="5" ry="5" fill="rgba(255,255,255,0.5)" />
</svg> 