<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | ABC Airlines</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/css/admin_dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <i data-lucide="plane" style="color: var(--primary); width: 24px;"></i>
                <h2>ABC Airlines</h2>
            </div>
            <div class="sidebar-menu">
                <a href="#" class="menu-item active" data-table="airport">
                    <i data-lucide="building"></i>
                    Airport
                </a>
                <a href="#" class="menu-item" data-table="plane">
                    <i data-lucide="plane"></i>
                    Plane
                </a>
                <a href="#" class="menu-item" data-table="flight">
                    <i data-lucide="compass"></i>
                    Flight
                </a>
                <a href="#" class="menu-item" data-table="flightSchedule">
                    <i data-lucide="calendar"></i>
                    Flight Schedule
                </a>
                <a href="#" class="menu-item" data-table="passenger">
                    <i data-lucide="user"></i>
                    Passenger
                </a>
                <a href="#" class="menu-item" data-table="booking">
                    <i data-lucide="ticket"></i>
                    Booking
                </a>
                <a href="#" class="menu-item" data-table="employee">
                    <i data-lucide="users"></i>
                    Employee
                </a>
                <a href="#" class="menu-item" data-table="flightEmployee">
                    <i data-lucide="clipboard-list"></i>
                    Flight Employee
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="page-header">
                <h1 id="current-table-title">Airport</h1>
                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="openAddModal()">
                        <i data-lucide="plus" style="width: 18px;"></i>
                        Add New
                    </button>
                </div>
            </div>

            <!-- Search box -->
            <div class="search-container">
                <i data-lucide="search" class="search-icon" style="width: 18px;"></i>
                <input type="text" class="search-input" placeholder="Search..." id="search-input">
            </div>

            <!-- Tables will be generated by JavaScript -->
        </div>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Add Airport</h3>
                <button class="modal-close" onclick="closeModal()">
                    <i data-lucide="x" style="width: 24px;"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="record-form">
                    <!-- Form fields will be dynamically added by JavaScript -->
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="saveRecord()">Save</button>
                <button class="btn btn-danger" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/js/admin_dashboard.js"></script>
</body>
</html>
