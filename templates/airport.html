<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airport Information Form | ABC Airlines</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #1E88E5;
            --primary-hover: #1976D2;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-white: #FFFFFF;
            --bg-light: #F7F9FC;
            --bg-white: #FFFFFF;
            --border-color: #E0E0E0;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: var(--text-primary);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            background: url('plane.jpg') center center/cover no-repeat fixed;
            background-color: var(--bg-light);
            overflow-x: hidden;
            /* filter:blur(.6); */
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(21, 40, 71, 0.75);
            z-index: -1;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            overflow: hidden;
            background-color: var(--bg-white);
            border-radius: 12px;
            box-shadow: var(--shadow);
            z-index: 10;
            position: relative;
        }
        
        .form-header {
            background-color: var(--primary);
            color: var(--text-white);
            padding: 24px;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        
        .form-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }
        
        .form-header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            z-index: 0;
        }
        
        .form-content {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.9rem;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            padding-left: 40px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-primary);
            transition: var(--transition);
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
            padding-left: 12px;
        }
        
        input:focus, textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.2);
        }
        
        .submit-btn {
            background-color: var(--primary);
            color: var(--text-white);
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .submit-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }
        
        .submit-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg, 
                rgba(255,255,255,0) 0%, 
                rgba(255,255,255,0.2) 50%, 
                rgba(255,255,255,0) 100%
            );
            transition: all 0.6s ease;
        }
        
        .submit-btn:hover::before {
            left: 100%;
        }
        
        .fade-in {
            animation: fadeIn 0.6s ease forwards;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 640px) {
            .container {
                border-radius: 0;
            }
            
            .form-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <div class="form-header">
            <h1>Airport Information</h1>
        </div>
        
        <div class="form-content">
            <form id="airportForm">
                <div class="form-group">
                    <label for="airportId">Airport ID</label>
                    <div class="input-wrapper">
                        <i data-lucide="hash"></i>
                        <input type="text" id="airportId" name="airportId" placeholder="Enter airport ID" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="name">Airport Name</label>
                    <div class="input-wrapper">
                        <i data-lucide="building"></i>
                        <input type="text" id="name" name="name" placeholder="Enter airport name" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="city">City</label>
                    <div class="input-wrapper">
                        <i data-lucide="map-pin"></i>
                        <input type="text" id="city" name="city" placeholder="Enter city name" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="contactNo">Contact Number</label>
                    <div class="input-wrapper">
                        <i data-lucide="phone"></i>
                        <input type="tel" id="contactNo" name="contactNo" placeholder="Enter contact number" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" placeholder="Enter complete address" required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">
                    Submit
                    <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
                </button>
            </form>
        </div>
    </div>
    
    <script>
        // Initialize Lucide icons
        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();
        });
        
        // Form submission
        document.getElementById('airportForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form values
            const airportId = document.getElementById('airportId').value;
            const name = document.getElementById('name').value;
            const city = document.getElementById('city').value;
            const contactNo = document.getElementById('contactNo').value;
            const address = document.getElementById('address').value;
            
            // Display collected data (for demonstration)
            console.log({
                airportId,
                name,
                city,
                contactNo,
                address
            });
            
            // Show success message
            alert('Airport information submitted successfully!');
            
            // Reset the form
            this.reset();
        });
    </script>
</body>
</html>
