<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Booking Form</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary: #1E88E5;
      --primary-hover: #1976D2;
      --text-primary: #333;
      --text-white: #fff;
      --bg-light: #F7F9FC;
      --bg-white: #fff;
      --border-color: #E0E0E0;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: url('plane.jpg') center/cover no-repeat fixed, var(--bg-light);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-primary);
      position: relative;
  overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(21, 40, 71, 0.75);
      z-index: -1;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: var(--bg-white);
      padding: 30px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      position: relative;
      z-index: 1;
    }

    .form-header {
      text-align: center;
      background: var(--primary);
      color: var(--text-white);
      padding: 24px;
    }

    .form-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: #888;
    }

    input, select {
      width: 100%;
      padding: 12px 12px 12px 40px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.2);
    }

    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: var(--text-white);
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    .submit-btn i {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-header">
      <h1>Booking Information</h1>
    </div>

    <form id="bookingForm" action="/add_booking" method="POST">
      <div class="form-group">
        <label for="passengerid">Passenger ID</label>
        <div class="input-wrapper">
          <i data-lucide="user-check"></i>
          <input type="text" id="passengerid" name="passengerid" required />
        </div>
      </div>

      <div class="form-group">
        <label for="scheduleid">Schedule ID</label>
        <div class="input-wrapper">
          <i data-lucide="calendar"></i>
          <input type="text" id="scheduleid" name="scheduleid" required />
        </div>
      </div>

      <div class="form-group">
        <label for="seatnumber">Seat Number</label>
        <div class="input-wrapper">
          <i data-lucide="chair"></i>
          <input type="text" id="seatno" name="seatno" required />
        </div>
      </div>

      <div class="form-group">
        <label for="bookingdate">Booking Date</label>
        <div class="input-wrapper">
          <i data-lucide="calendar-days"></i>
          <input type="date" id="bookingdate" name="bookingdate" required />
        </div>
      </div>

      <button type="submit" class="submit-btn">
        Submit
        <i data-lucide="arrow-right"></i>
      </button>
    </form>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      lucide.createIcons();

      // Set today's date
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('bookingdate').value = today;
    });
  </script>
</body>
</html>
