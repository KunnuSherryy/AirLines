<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ABC Airlines Reservation System</title>
    <link rel="stylesheet" href="/static/css/auth.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        <div class="background-image"></div>
        
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
        
        <div class="auth-container">
            <div class="auth-header">
                <h1>AIRLINE RESERVATION SYSTEM</h1>
            </div>
            
            <div class="auth-form-container">
                <form action="#" method="post" class="auth-form">
                    <h2>Login</h2>
                    
                    <div class="form-group">
                        <label for="username">Phone Number or Email</label>
                        <input type="text" id="username" name="username" placeholder="Enter your email or phone number" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    
                    <div class="form-options">
                        <div class="remember-me">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember">Remember me</label>
                        </div>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>
                    
                    <button type="submit" class="btn-submit">Log In</button>
                    
                    <div class="auth-links">
                        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Animate form elements immediately on page load
        document.addEventListener('DOMContentLoaded', function() {
            const formElements = document.querySelectorAll('.form-group, .btn-submit, .auth-links');
            formElements.forEach((element, index) => {
                setTimeout(() => {
                    element.classList.add('fade-in');
                }, 100 * index);
            });
        });
    </script>
</body>
</html>
